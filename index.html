<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>$ASGI — Superintelligence. Naturally Inu.</title>
  <meta name="description" content="We built superintelligence. It found the launchpad. $ASGI: the first superintelligent Inu to discover the launchpad." />
  <meta name="theme-color" content="#05010f" />
  <meta property="og:title" content="$ASGI — Superintelligence. Naturally Inu." />
  <meta property="og:description" content="We built superintelligence. It found the launchpad." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="assets/face.webp" type="image/webp" />
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/silkscreen-latin-700.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/vt323-latin-400.woff2" crossorigin />
  <link rel="preload" as="image" href="assets/hero.webp" fetchpriority="high" />
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <!-- deep-space backdrop: parallax star layers + drifting planets -->
  <div class="space" aria-hidden="true">
    <div class="stars stars--1"></div>
    <div class="stars stars--2"></div>
    <div class="stars stars--3"></div>
    <div class="planet planet--a"></div>
    <div class="planet planet--b"></div>
  </div>

  <!-- CRT overlay -->
  <div class="crt" aria-hidden="true"><div class="crt__scan"></div><div class="crt__grain"></div><div class="crt__vignette"></div></div>

  <header class="nav" id="nav"></header>

  <main id="app"></main>

  <footer class="footer" id="footer"></footer>

  <!-- taskbar: START menu, minimised-window chips, clock, CRT toggle -->
  <div class="taskbar" id="taskbar"></div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="launch-overlay" id="launchOverlay" aria-hidden="true"></div>
  <div class="modal" id="modal" hidden></div>

  <noscript><p style="color:#19f3ff;font-family:monospace;padding:2rem">$ASGI needs JavaScript. The Inu runs on JavaScript.</p></noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
